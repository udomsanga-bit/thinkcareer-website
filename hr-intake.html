<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>HR Solutions Intake Form — ThinkCareer</title>
<link rel="canonical" href="https://www.thinkcareers.net/hr-intake">
<link rel="icon" href="assets/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Same tokens as thinkcareers.net (index.html) — kept in sync so this page
     matches the rest of the site in both light and dark mode. */
  --navy:#1B2D57;
  --navy-deep:#14224A;
  --mint:#8FBFB5;
  --mint-hover:#A5CDC4;
  --ink:#0F1A2E;
  --muted:#4A5873;
  --bg:#FFFFFF;
  --mist:#F1F4F9;
  --on-navy:#F4F6FB;
  --on-navy-muted:#C9D3E6;
  --border-solid:#E1E6EF;
  --danger:#B3261E;
  --danger-soft:#FBEAE8;
  /* Theme-aware tokens: these are the ones that actually flip in dark mode.
     --navy/--mint stay fixed (same philosophy as the live site) because they
     only ever sit on their own dark surfaces; anything that sits on --mist or
     --bg uses one of these instead so it keeps enough contrast at night. */
  --head:#1B2D57;
  --accent:#1F6B5C;
  --action:#1B2D57;
  --action-hover:#14224A;
  --action-fg:#FFFFFF;
  --link:#1B2D57;
  --bar-bg:#1B2D57;
  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:18px;
  --display:"Sora","Kantumruy Pro",system-ui,sans-serif;
  --sans:"Kantumruy Pro","Noto Sans Khmer",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1426; --mist:#1A2748; --ink:#EEF3FB; --muted:#AAB7CD; --border-solid:#28365A; --danger-soft:#2A1216;
    --head:#F4F6FB; --accent:#8FD0C0; --action:#8FBFB5; --action-hover:#A5CDC4; --action-fg:#0C1426; --link:#8FBFB5;
    --navy-deep:#0A1120; --bar-bg:#0F1830; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1426; --mist:#1A2748; --ink:#EEF3FB; --muted:#AAB7CD; --border-solid:#28365A; --danger-soft:#2A1216;
  --head:#F4F6FB; --accent:#8FD0C0; --action:#8FBFB5; --action-hover:#A5CDC4; --action-fg:#0C1426; --link:#8FBFB5;
  --navy-deep:#0A1120; --bar-bg:#0F1830; color-scheme:dark;
}

*{box-sizing:border-box;}
body{margin:0; font-family:var(--sans); font-size:16px; background:var(--bg); color:var(--ink);}
a{color:var(--link);}
.page{min-height:100vh; display:flex; flex-direction:column;}

.header{position:sticky; top:0; z-index:20; background:var(--bar-bg); color:#fff;}
.header-inner{padding:12px 24px; display:flex; align-items:center; gap:11px; flex-wrap:wrap; max-width:720px; margin:0 auto;}
.brand-logo{width:34px; height:34px; border-radius:8px; flex-shrink:0; display:block; object-fit:cover;}
.brand-name{font-family:var(--display); font-weight:700; font-size:17px; letter-spacing:0.2px;}
.brand-sub{font-size:13px; color:var(--on-navy-muted); margin-left:auto;}
.progress-track{height:4px; background:rgba(255,255,255,0.18);}
.progress-fill{height:100%; background:var(--mint); transition:width .4s cubic-bezier(.22,1,.36,1);}

.container{flex:1 1 auto; width:100%; max-width:720px; margin:0 auto; padding:30px 20px 70px; box-sizing:border-box;}
.card{background:var(--bg); border-radius:var(--radius-lg); padding:clamp(22px,5vw,44px); box-shadow:0 1px 3px rgba(15,26,46,0.07),0 10px 28px rgba(15,26,46,0.06); box-sizing:border-box; overflow:hidden; min-height:420px; display:flex; flex-direction:column;}

@keyframes stepIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
.step-anim{animation:stepIn .28s cubic-bezier(.22,1,.36,1) both; flex:1 1 auto; display:flex; flex-direction:column;}
@keyframes choiceIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
@keyframes choicePulse{ 0%{transform:scale(1);} 45%{transform:scale(1.015);} 100%{transform:scale(1);} }
@keyframes checkPop{ from{opacity:0; transform:scale(.4) rotate(-8deg);} to{opacity:1; transform:scale(1) rotate(0);} }
@keyframes btnConfirmFlash{ 0%{filter:brightness(1);} 40%{filter:brightness(1.22);} 100%{filter:brightness(1);} }
@media (prefers-reduced-motion: reduce){ .step-anim,.choice-item,.choice-check,.btn,.btn-back,.btn-skip{animation:none!important;} .progress-fill{transition:none;} .choice-item,.btn,.btn-back,.btn-skip{transition:none;} .btn::after{display:none;} .btn svg,.btn-back svg{transition:none; transform:none!important;} .choice-list.is-committing .choice-item:not(.is-selected){opacity:1!important;} .cf-icon-ring,.cf-icon-core,.cf-rise{animation:none!important; opacity:1!important; transform:none!important;} .cf-check-path{animation:none!important; stroke-dashoffset:0!important;} .cf-icon-pulse,.cf-confetti{display:none!important;} }

.q-eyebrow-group{display:inline-flex; align-items:center; background:var(--mist); color:var(--accent); border-radius:999px; padding:6px 14px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:16px; width:fit-content;}
.q-title-en{font-family:var(--display); font-size:24px; font-weight:700; color:var(--head); margin:0 0 7px; line-height:1.32;}
.q-title-kh{font-size:15px; color:var(--muted); margin:0 0 28px; line-height:1.65;}
.required-mark{color:var(--danger); margin-left:4px;}

.field-input,.field-textarea{width:100%; min-height:48px; padding:13px 15px; border-radius:var(--radius-sm); border:1.5px solid var(--border-solid); font-size:16px; font-family:inherit; background:var(--bg); color:var(--ink); transition:border-color .15s ease, box-shadow .15s ease;}
.field-input:focus,.field-textarea:focus{outline:none; border-color:var(--mint); box-shadow:0 0 0 3px rgba(143,191,181,0.3);}
.field-input.err,.field-textarea.err{border-color:var(--danger);}
.field-textarea{min-height:110px; resize:vertical;}
.error-text{color:var(--danger); font-size:13.5px; margin-top:8px; display:flex; align-items:center; gap:5px;}
.error-text svg{width:14px; height:14px; flex-shrink:0;}
.error-banner{background:var(--danger-soft); color:var(--danger); border-radius:var(--radius-sm); padding:12px 14px; font-size:13.5px; margin-top:16px;}

.choice-list{display:flex; flex-direction:column; gap:10px;}
.choice-item{width:100%; display:flex; align-items:center; gap:14px; text-align:left; padding:15px 17px; border-radius:var(--radius-md); border:1.5px solid var(--border-solid); background:var(--bg); font-family:inherit; font-size:15.5px; color:var(--ink); cursor:pointer; transition:border-color .15s ease, background .15s ease, transform .08s ease; animation:choiceIn .26s ease both;}
.choice-list .choice-item:nth-child(1){animation-delay:0ms;}
.choice-list .choice-item:nth-child(2){animation-delay:35ms;}
.choice-list .choice-item:nth-child(3){animation-delay:70ms;}
.choice-list .choice-item:nth-child(4){animation-delay:105ms;}
.choice-list .choice-item:nth-child(5){animation-delay:140ms;}
.choice-list .choice-item:nth-child(6){animation-delay:175ms;}
.choice-item:hover{border-color:var(--mint-hover); background:var(--mist);}
.choice-item:active{transform:scale(0.99);}
.choice-item.is-selected{border-color:var(--action); background:var(--mist);}
.choice-item.is-committing{animation:choicePulse .22s ease .1s;}
.choice-list.is-committing .choice-item:not(.is-selected){opacity:.4; pointer-events:none; transition:opacity .15s ease;}
.choice-badge{width:30px; height:30px; border-radius:50%; background:var(--mist); color:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0;}
.choice-item.is-selected .choice-badge{background:var(--action); color:var(--action-fg);}
.choice-label{flex:1 1 auto; line-height:1.4;}
.choice-check{width:19px; height:19px; flex-shrink:0; color:var(--accent); animation:checkPop .22s cubic-bezier(.34,1.56,.64,1) both;}

.doc-row{display:flex; align-items:flex-start; gap:12px; padding:13px 0; border-bottom:1px solid var(--mist); cursor:pointer;}
.doc-row input{margin-top:3px; width:19px; height:19px; accent-color:var(--action); flex-shrink:0;}
.doc-en{display:block; font-weight:500; color:var(--ink); font-size:15px;}
.doc-kh{display:block; font-size:13px; color:var(--muted); margin-top:2px;}

.consent-box{background:var(--mist); border:1px solid var(--border-solid); border-radius:var(--radius-md); padding:18px; display:flex; gap:12px; align-items:flex-start; margin-top:4px;}
.consent-box input{margin-top:3px; width:19px; height:19px; accent-color:var(--action); flex-shrink:0;}

.nav-row{display:flex; align-items:center; margin-top:30px; gap:10px;}
.nav-spacer{flex:1 1 auto;}
.btn{position:relative; overflow:hidden; border-radius:var(--radius-sm); padding:13px 24px; min-height:48px; font-size:15.5px; font-weight:600; cursor:pointer; font-family:inherit; border:none; display:inline-flex; align-items:center; gap:7px; transition:background .15s ease, transform .1s ease;}
.btn::after{content:''; position:absolute; inset:0; background:radial-gradient(circle, rgba(255,255,255,.4) 0%, transparent 70%); opacity:0; transform:scale(.3); pointer-events:none; transition:opacity .4s ease, transform .4s ease;}
.btn:active::after{opacity:1; transform:scale(1); transition:none;}
.btn:active{transform:scale(0.97);}
.btn svg{width:16px; height:16px; transition:transform .18s ease;}
.btn:hover svg{transform:translateX(3px);}
.btn-primary{background:var(--action); color:var(--action-fg);}
.btn-primary:hover{background:var(--action-hover);}
.btn.is-committing{animation:choicePulse .22s ease, btnConfirmFlash .5s ease; pointer-events:none;}
.btn[disabled]{opacity:.65; pointer-events:none;}
.btn-back{background:none; border:none; color:var(--muted); font-size:14.5px; cursor:pointer; font-family:inherit; display:inline-flex; align-items:center; gap:6px; padding:10px 6px; transition:color .15s ease, transform .1s ease;}
.btn-back:hover{color:var(--head);}
.btn-back:active{transform:scale(0.96);}
.btn-back svg{width:16px; height:16px; transition:transform .18s ease;}
.btn-back:hover svg{transform:translateX(-3px);}
.btn-skip{background:none; border:none; color:var(--muted); font-size:14.5px; cursor:pointer; font-family:inherit; text-decoration:underline; padding:10px 6px; transition:color .15s ease, transform .1s ease;}
.btn-skip:hover{color:var(--head);}
.btn-skip:active{transform:scale(0.96);}

.multiselect-list{display:flex; flex-direction:column; gap:10px;}
.multiselect-item{width:100%; display:flex; align-items:center; gap:14px; text-align:left; padding:14px 16px; border-radius:var(--radius-md); border:1.5px solid var(--border-solid); background:var(--bg); font-family:inherit; font-size:15px; color:var(--ink); cursor:pointer; transition:border-color .15s ease, background .15s ease, transform .08s ease, opacity .15s ease;}
.multiselect-item:hover{border-color:var(--mint-hover); background:var(--mist);}
.multiselect-item:active{transform:scale(0.99);}
.multiselect-item.is-selected{border-color:var(--action); background:var(--mist);}
.multiselect-item.is-disabled{opacity:.4; pointer-events:none;}
.ms-check{width:20px; height:20px; border-radius:5px; border:1.5px solid var(--border-solid); flex-shrink:0; display:flex; align-items:center; justify-content:center; background:var(--bg);}
.multiselect-item.is-selected .ms-check{background:var(--action); border-color:var(--action);}
.ms-check svg{width:13px; height:13px; color:var(--action-fg); opacity:0; transition:opacity .12s ease;}
.multiselect-item.is-selected .ms-check svg{opacity:1;}
.ms-label{flex:1 1 auto; line-height:1.4;}
.ms-helper{font-size:13px; color:var(--muted); margin:-6px 0 16px;}
.ms-other-input{margin-top:4px;}

.cf-icon-wrap{position:relative; width:110px; height:110px; margin:4px auto 26px;}
.cf-icon-ring{position:absolute; inset:0; border-radius:50%; background:var(--mist); opacity:0; transform:scale(.4); animation:cfRingIn .42s cubic-bezier(.34,1.56,.64,1) .05s both;}
.cf-icon-core{position:absolute; inset:14px; border-radius:50%; background:var(--action); opacity:0; transform:scale(.3); animation:cfCoreIn .4s cubic-bezier(.34,1.56,.64,1) .22s both; display:flex; align-items:center; justify-content:center; box-shadow:0 10px 26px rgba(27,45,87,.28);}
.cf-icon-pulse{position:absolute; inset:14px; border-radius:50%; border:2px solid var(--mint); opacity:0; animation:cfPulseRing 1s cubic-bezier(.2,.6,.2,1) .95s both;}
.cf-check-svg{width:46px; height:46px;}
.cf-check-path{fill:none; stroke:var(--action-fg); stroke-width:4.5; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:1; stroke-dashoffset:1; animation:cfDrawCheck .5s cubic-bezier(.65,0,.35,1) .62s forwards;}
.cf-confetti{position:absolute; inset:0; pointer-events:none;}
.cf-dot{position:absolute; top:50%; left:50%; border-radius:50%; opacity:0; animation:cfBurst .95s cubic-bezier(.19,1,.22,1) both;}
.cf-rise{opacity:0; transform:translateY(10px); animation:cfRiseIn .42s ease both;}
.cf-d1{animation-delay:.98s;}
.cf-d2{animation-delay:1.1s;}
.cf-d3{animation-delay:1.26s;}
.cf-d4{animation-delay:1.38s;}
@keyframes cfRingIn{ to{opacity:1; transform:scale(1);} }
@keyframes cfCoreIn{ to{opacity:1; transform:scale(1);} }
@keyframes cfDrawCheck{ to{stroke-dashoffset:0;} }
@keyframes cfRiseIn{ to{opacity:1; transform:translateY(0);} }
@keyframes cfPulseRing{ 0%{opacity:.55; transform:scale(1);} 100%{opacity:0; transform:scale(1.55);} }
@keyframes cfBurst{
  0%{ transform:translate(-50%,-50%) scale(.3); opacity:0; }
  18%{ opacity:1; }
  100%{ transform:translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1); opacity:0; }
}

.section-icon{width:58px; height:58px; border-radius:50%; background:var(--mist); display:flex; align-items:center; justify-content:center; margin-bottom:22px;}
.section-icon svg{width:27px; height:27px; color:var(--accent);}

.intro-p{font-size:15.5px; line-height:1.6; color:var(--ink); margin:0 0 12px;}
.intro-p-kh{font-size:14.5px; line-height:1.7; color:var(--muted); margin:0 0 20px;}
.intro-box{background:var(--mist); border-radius:var(--radius-md); padding:18px; margin:20px 0 28px;}
.intro-box-title{font-weight:700; color:var(--accent); font-size:14px; margin-bottom:6px; display:flex; align-items:center; gap:6px;}
.intro-box-title svg{width:15px; height:15px; flex-shrink:0;}
.intro-time{display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); margin:14px 0 0;}
.intro-time svg{width:14px; height:14px; flex-shrink:0;}

.next-table{width:100%; border-collapse:collapse; margin-top:16px;}
.next-table td{padding:12px 0; border-bottom:1px solid var(--mist); font-size:14px; vertical-align:top;}
.next-table td.step-num{width:28px; font-weight:700; color:var(--head);}
.next-kh{color:var(--muted); display:block; margin-top:3px;}

.hp-field{position:absolute; left:-9999px; top:-9999px; width:1px; height:1px; overflow:hidden;}
</style>
</head>
<body>
<div class="page" id="app"></div>

<script>
(function () {
  "use strict";

    return [
      ["yes", "Yes (written down) · មាន (ជាលាយលក្ខណ៍អក្សរ)"],
      ["informal", "Informal (done, not written) · មិនផ្លូវការ (ធ្វើ តែមិនមានឯកសារ)"],
      ["no", "No · គ្មាន"],

  function buildQuestions() {
    return [
      { id: "full_name", kind: "text", type: "text", required: true, section: "About you · អំពីលោកអ្នក", en: "Full name", kh: "ឈ្មោះពេញ" },
      { id: "position", kind: "single", required: true, section: "About you · អំពីលោកអ្នក", en: "What is your position?", kh: "តួនាទី", options: [["owner", "Owner · ម្ចាស់"], ["cofounder", "Co-founder · សហស្ថាបនិក"], ["manager", "Manager · អ្នកគ្រប់គ្រង"], ["other", "Other · ផ្សេងៗ"]] },
      { id: "phone", kind: "text", type: "tel", required: true, section: "About you · អំពីលោកអ្នក", en: "Phone / Telegram", kh: "លេខទូរស័ព្ទ / Telegram" },
      { id: "email", kind: "text", type: "email", required: false, section: "About you · អំពីលោកអ្នក", en: "Email", kh: "អ៊ីមែល" },
      { id: "meeting_language", kind: "single", required: true, section: "About you · អំពីលោកអ្នក", en: "Preferred meeting language", kh: "ភាសាដែលពេញចិត្តសម្រាប់កិច្ចប្រជុំ", options: [["khmer", "Khmer · ខ្មែរ"], ["english", "English · អង់គ្លេស"], ["either", "Either · ទាំងពីរ"]] },

      { id: null, kind: "section", en: "Your business", kh: "អំពីអាជីវកម្ម" },

      { id: "company_name", kind: "text", type: "text", required: true, section: "Your business · អំពីអាជីវកម្ម", en: "Company name / trading name", kh: "ឈ្មោះក្រុមហ៊ុន / ឈ្មោះពាណិជ្ជកម្ម" },
      { id: "legal_form", kind: "single", required: true, section: "Your business · អំពីអាជីវកម្ម", en: "Legal form", kh: "ទម្រង់គតិយុត្ត", options: [["sole_proprietor", "Sole proprietor · សហគ្រាសឯកបុគ្គល"], ["co_ltd", "Co., Ltd · ក្រុមហ៊ុនឯកជនទទួលខុសត្រូវមានកម្រិត"], ["other", "Other · ផ្សេងៗ"], ["not_sure", "Not sure · មិនប្រាកដ"]] },
      { id: "industry", kind: "textarea", required: true, section: "Your business · អំពីអាជីវកម្ម", en: "Industry and main products or services", kh: "វិស័យ និងផលិតផល ឬសេវាកម្មចម្បង" },
      { id: "year_started", kind: "single", required: false, section: "Your business · អំពីអាជីវកម្ម", en: "Year started", kh: "ឆ្នាំចាប់ផ្តើមប្រតិបត្តិការ", options: [["before_2010", "Before 2010"], ["2010_2015", "2010–2015"], ["2016_2020", "2016–2020"], ["2021_2023", "2021–2023"], ["2024_2026", "2024–2026"], ["not_sure", "Not sure · មិនប្រាកដ"]] },
      { id: "locations", kind: "text", type: "text", required: false, section: "Your business · អំពីអាជីវកម្ម", en: "Locations / branches", kh: "ទីតាំង / សាខា" },

      var angle = (360 / n) * i + (Math.random() * 18 - 9);
      var dist = 70 + Math.random() * 65;
      var rad = (angle * Math.PI) / 180;
      var tx = Math.round(Math.cos(rad) * dist);
      var ty = Math.round(Math.sin(rad) * dist);
      var size = 4 + Math.round(Math.random() * 4);
      var delay = 620 + Math.round(Math.random() * 160);
      dots.push({ style: "--tx:" + tx + "px; --ty:" + ty + "px; width:" + size + "px; height:" + size + "px; background:" + colors[i % colors.length] + "; animation-delay:" + delay + "ms;" });
    }
    return dots;
  }

  function isFieldEmpty(id, fd) {
    if (id === "consent") return fd.consent !== true;
    var v = fd[id];
    if (Array.isArray(v)) return v.length === 0;
    return v === undefined || v === null || String(v).trim() === "";
  }

  function update(id, value) { state.formData[id] = value; }
  function toggleBool(id) { state.formData[id] = !state.formData[id]; render(); }

  function toggleMultiselect(id, value, max) {
    var current = state.formData[id] || [];
    var next;
    var i = current.indexOf(value);
    if (i !== -1) {
      next = current.filter(function (v) { return v !== value; });
    } else {
      if (max && current.length >= max) return;
      next = current.concat([value]);
    }
    state.formData[id] = next;
    render();
  }

  function replayConfirm() {
    state.confirmPlaying = false;
    render();
    setTimeout(function () {
      state.confirmPlaying = true;
      state.confetti = makeConfetti();
      render();
    }, 60);
  }

  function start() {
    if (state.committing) return;
    state.committing = true;
    state.showErrors = false;
    render();
    setTimeout(function () {
      state.qIndex = 1;
      state.committing = false;
      render();
    }, 180);
  }

  function back() {
    if (state.committing) return;
    state.qIndex = Math.max(0, state.qIndex - 1);
    state.showErrors = false;
    render();
  }

  function skip() {
    if (state.committing) return;
    state.qIndex = state.qIndex + 1;
    state.showErrors = false;
    render();
  }

  function answerAndAdvance(id, value) {
    if (state.committing) return;
    state.formData[id] = value;
    state.committing = true;
    state.showErrors = false;
    render();
    setTimeout(function () {
      state.qIndex = state.qIndex + 1;
      state.committing = false;
      render();
    }, 180);
  }

  function advanceAfterCommit() {
    state.committing = true;
    state.showErrors = false;
    render();
    setTimeout(function () {
      state.qIndex = state.qIndex + 1;
      state.committing = false;
      render();
    }, 180);
  }

  function submitForm() {
    state.submitting = true;
    state.submitError = "";
    render();
    var payload = Object.assign({}, state.formData);
    fetch("/api/hr-intake", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    })
      .then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (data) { return { res: res, data: data }; });
      })
      .then(function (result) {
        if (!result.res.ok) {
          state.submitting = false;
          state.submitError = result.data.error || "Something went wrong. Please try again.";
          render();
          return;
        }
        state.submitting = false;
        state.qIndex = state.qIndex + 1;
        state.confirmPlaying = true;
        state.confetti = makeConfetti();
        render();
      })
      .catch(function () {
        state.submitting = false;
        state.submitError = "Network error. Please check your connection and try again.";
        render();
      });
  }

  function continueClick() {
    if (state.committing || state.submitting) return;
    var q = QUESTIONS[state.qIndex - 1];
    if (q.required && (q.kind === "text" || q.kind === "textarea" || q.kind === "multiselect")) {
      if (isFieldEmpty(q.id, state.formData)) { state.showErrors = true; render(); return; }
    }
    if (q.required && q.kind === "consent") {
      if (state.formData.consent !== true) { state.showErrors = true; render(); return; }
    }
    if (state.qIndex === TOTAL) {
      submitForm();
      return;
    }
    advanceAfterCommit();
  }

  function attachListeners(root, currentQ) {
    root.querySelectorAll("[data-field]").forEach(function (el) {
      if (el.type === "checkbox") return; // handled via data-action
      el.addEventListener("input", function () { update(el.getAttribute("data-field"), el.value); });
    });
    root.querySelectorAll('[data-action="toggle-bool"]').forEach(function (el) {
      el.addEventListener("change", function () { toggleBool(el.getAttribute("data-field")); });
    });
    root.querySelectorAll('[data-action="pick-single"]').forEach(function (el) {
      el.addEventListener("click", function () { answerAndAdvance(el.getAttribute("data-field"), el.getAttribute("data-value")); });
    });
    root.querySelectorAll('[data-action="pick-multi"]').forEach(function (el) {
      el.addEventListener("click", function () {
        var max = parseInt(el.getAttribute("data-max"), 10) || 0;
        toggleMultiselect(el.getAttribute("data-field"), el.getAttribute("data-value"), max);
      });
    });
    var startBtn = root.querySelector('[data-action="start"]'); if (startBtn) startBtn.addEventListener("click", start);
    var backBtn = root.querySelector('[data-action="back"]'); if (backBtn) backBtn.addEventListener("click", back);
    var skipBtn = root.querySelector('[data-action="skip"]'); if (skipBtn) skipBtn.addEventListener("click", skip);
    var continueBtn = root.querySelector('[data-action="continue"]'); if (continueBtn) continueBtn.addEventListener("click", continueClick);
    var replayBtn = root.querySelector('[data-action="replay"]'); if (replayBtn) replayBtn.addEventListener("click", replayConfirm);
  }

  render();
})();
</script>
</body>
</html>
